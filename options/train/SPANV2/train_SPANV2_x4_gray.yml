# SPANV2 single-channel 8-bit grayscale training from scratch.
name: SPANV2_x4_gray_from_scratch_2.0
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: CustomTrain
    type: PairedImageDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset_train_v1/train/HR
    dataroot_lq: C:/Users/Ada/Desktop/dataset_train_v1/train/LR
    io_backend:
      type: disk
    color: gray
    gt_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
  val:
    name: CustomVal
    type: PairedImageDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset_train_v1/val/HR
    dataroot_lq: C:/Users/Ada/Desktop/dataset_train_v1/val/LR
    io_backend:
      type: disk
    color: gray

network_g:
  type: SPANV2_ESR
  num_in_ch: 1
  num_out_ch: 1
  feature_channels: 32
  upscale: 4
  bias: false
  use_span_attn: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [200000, 250000]
    gamma: 0.5
  total_iter: 300000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
