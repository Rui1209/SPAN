# SPANV2_Residual Stage 1 (official recipe): multi-shape HR crops (256~512),
# L1 + FFT loss, AdamW lr 1e-3, cosine annealing over 1M iters to eta_min 1e-6.
# Single-channel 8-bit grayscale, trained from scratch.
name: SPANV2_x4_gray_residual_stage1
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: CustomTrain
    type: PairedMultiShapeDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset_train_v1/train/HR
    dataroot_lq: C:/Users/Ada/Desktop/dataset_train_v1/train/LR
    io_backend:
      type: disk
    color: gray
    gt_shapes:
      - [256, 256]
      - [320, 320]
      - [384, 384]
      - [512, 512]
      - [320, 512]
      - [512, 320]
      - [384, 512]
      - [512, 384]
    collate_fn: paired_multi_shape
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
  val:
    name: CustomVal
    type: PairedImageDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset_train_v1/val/HR
    dataroot_lq: C:/Users/Ada/Desktop/dataset_train_v1/val/LR
    io_backend:
      type: disk
    color: gray

network_g:
  type: SPANV2_ESR_Residual
  num_in_ch: 1
  num_out_ch: 1
  feature_channels: 32
  upscale: 4
  bias: false
  use_span_attn: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  total_iter: 1000000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 0.05
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
