# SPANV2 single-channel 14-bit TIFF in/out testing (16-bit TIFF holding 14-bit values, LSB-aligned).
# Weights: SPANV2_x4_gray_from_scratch_1.2 @ iter 295000 (params_ema)
# NOTE: edit dataroot_lq below to your TIFF folder before running.
name: SPANV2_1.2_tiff_0910
model_type: SRModel14bit
scale: 4
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:
    name: TIFF14bit
    type: SingleImage14bitDataset
    dataroot_lq: C:/Users/Ada/Desktop/Building_0910/LR_14-bit_tiff_bilinear
    out_channels: 1 # keep 1ch for the single-channel SPANV2
    io_backend:
      type: disk

network_g:
  type: SPANV2_ESR
  num_in_ch: 1
  num_out_ch: 1
  feature_channels: 32
  upscale: 4
  bias: false
  use_span_attn: false

path:
  pretrain_network_g: experiments/SPANV2_x4_gray_from_scratch_1.2/models/net_g_295000.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  pbar: true
