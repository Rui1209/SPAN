# SPANV2 single-channel 8-bit grayscale testing.
name: SPANV2_x4_Building_attention_2.0
model_type: SRModel
scale: 4
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:
    name: CustomTest
    type: PairedImageDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset_train_v1/test/raw3_test_8-bit
    dataroot_lq: C:/Users/Ada/Desktop/dataset_train_v1/test/raw3_test_8-bit_LR
    io_backend:
      type: disk
    color: gray

network_g:
  type: SPANV2_ESR
  num_in_ch: 1
  num_out_ch: 1
  feature_channels: 32
  upscale: 4
  bias: false
  use_span_attn: false

path:
  pretrain_network_g: experiments/SPANV2_x4_gray_from_scratch_2.0/models/net_g_295000.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
