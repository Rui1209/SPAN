name: SPAN_x4_ch48_building
model_type: SRModel
scale: 4
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:
    name: NCSIST
    type: PairedImageDataset
    dataroot_gt: C:/Users/Ada/Desktop/dataset/Building/8bit_png_2560_1920
    dataroot_lq: C:/Users/Ada/Desktop/dataset/Building/8bit_png_640_480
    io_backend:
      type: disk
  # test_2:
  #   name: Set14
  #   type: PairedImageDataset
  #   dataroot_gt: datasets/Set14/GTmod12
  #   dataroot_lq: datasets/Set14/LRbicx4
  #   io_backend:
  #     type: disk
  # test_3:
  #   name: DIV2K100
  #   type: PairedImageDataset
  #   dataroot_gt: datasets/DIV2K/DIV2K_valid_HR
  #   dataroot_lq: datasets/DIV2K/DIV2K_valid_LR_bicubic/X4
  #   filename_tmpl: "{}x4"
  #   io_backend:
  #     type: disk

network_g:
  type: SPAN
  num_in_ch: 3
  num_out_ch: 3
  feature_channels: 48
  upscale: 4
  img_range: 255.
  rgb_mean: [0.4488, 0.4371, 0.4040]

path:
  pretrain_network_g: span/spanx4_ch48.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
